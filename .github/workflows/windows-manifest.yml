name: windows-vcpkg-manifest

# Canary for an experiment, not a gate on anything the project ships.
#
# ADR 0007 makes MinGW-w64/MSYS2 the supported Windows toolchain, so vcpkg.json
# is no longer the Windows dependency contract: it records what a future MSVC
# build would need. This job exists only so that experiment cannot rot silently
# while it sits in the tree. The workflow that guards the real Windows setup is
# windows-msys2.yml.
#
# A full GnuCash build is not possible from stock MSYS2 packages anyway: there is
# no mingw-w64 Guile and no libdbi, which is why upstream's gnucash-on-windows
# environment builds both from patched source with jhbuild.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  resolve-manifest:
    runs-on: windows-latest
    name: Resolve the Qt 6 vcpkg manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          # builtin-baseline pins a commit that is older than the clone's HEAD,
          # so fetch it explicitly; a shallow clone does not contain it.
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C "$env:RUNNER_TEMP\vcpkg" fetch --depth 1 origin $baseline

      - name: Bootstrap vcpkg
        run: '& "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Resolve dependencies for x64-windows
        run: |
          $out = & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install --dry-run --triplet x64-windows --x-install-root="$env:RUNNER_TEMP\installed" 2>&1
          $out | Write-Host
          $text = $out | Out-String
          foreach ($port in 'qtbase', 'qtwebengine') {
            if ($text -notmatch [regex]::Escape($port)) {
              throw "vcpkg did not resolve $port; the manifest or the baseline is broken."
            }
          }

      - name: List CMake presets
        run: |
          $out = & cmake --list-presets 2>&1
          $out | Write-Host
          if (($out | Out-String) -notmatch 'windows-msys2-debug') {
            throw 'The Windows configure preset is missing.'
          }
