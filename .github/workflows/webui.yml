name: webui
# The web tier is the one build that claims to need no toolkit at all, so it
# gets its own job: configure with WITH_GNUCASH=OFF, build only the server and
# the report engine, then run the server's smoke test.
on:
  push:
    branches: ['webui/**']
  pull_request:
    branches: ['webui/**']
  # Also run on demand: the branch is developed without waiting for pushes,
  # and a manual run is how a skipped push gets exercised.
  workflow_dispatch:
permissions: {}

jobs:
  webd:
    runs-on: ubuntu-24.04
    name: Toolkit-free server
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies (no GTK, no WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build gettext swig \
            libxslt-dev xsltproc \
            libglib2.0-dev guile-3.0-dev guile-json \
            libboost-all-dev libgtest-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWITH_GNUCASH=OFF \
            -DWITH_REPORT=ON \
            -DWITH_WEBUI=ON \
            -DWITH_PYTHON=OFF \
            -DWITH_AQBANKING=OFF \
            -DWITH_OFX=OFF \
            -DWITH_SQL=OFF

      - name: Build
        # The whole toolkit-free tree, not just the binary: the server loads
        # the Scheme report modules and the XML backend at run time, so a
        # target-only build produces a server that cannot open a book.
        run: cmake --build build -j"$(nproc)"

      # The claim is about what the process loads, so check the binary rather
      # than the cache: the cache mentions GTK even when nothing links it.
      - name: Check the server has no toolkit
        run: |
          if ldd build/bin/gnc-webd | grep -qiE 'libgtk|libgdk|libwebkit|libpango'; then
            echo "::error::gnc-webd links a GUI toolkit"
            ldd build/bin/gnc-webd | grep -iE 'gtk|gdk|webkit|pango'
            exit 1
          fi

      - name: Smoke test
        run: bash web/run-smoke-test.sh "$PWD/build" "$PWD"

      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Browser UI test
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PW_NO_SANDBOX: '1'
        run: bash web/run-ui-test.sh "$PWD/build" "$PWD" "$PWD/ui-screenshot.png"

      - name: Upload UI screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webd-ui-screenshot
          path: ui-screenshot.png
          if-no-files-found: ignore

      # Packaging is not checked here: MakeDist.cmake refuses to build a
      # tarball when WITH_GNUCASH=OFF ("Creation of dist tarballs is not
      # supported when WITH_GNUCASH=OFF"), so a toolkit-free job cannot see
      # what the tarball contains. The distcheck job covers it.

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webd-logs
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeCache.txt
