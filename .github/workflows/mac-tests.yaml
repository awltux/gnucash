name: mac-tests
on: [push, pull_request]
permissions: {}
jobs:
  ci_tests_mac:
    runs-on: macos-latest
    name: macOS CI Tests
    env:
      TZ: America/Los_Angeles
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: configure Environment
      run: |
        echo "PATH=$HOME/gnucash/inst/bin:$PATH" >> $GITHUB_ENV
        echo "PREFIX=$HOME/gnucash/inst" >> $GITHUB_ENV
        echo "SRCROOT=$HOME/gnucash/source" >> $GITHUB_ENV
        brew install ninja
    - name: download dependency tarball
      # downloads.sourceforge.net answers a browser user agent with a 301 to
      # the HTML "your download will begin shortly" page (and a Cloudflare bot
      # cookie); a plain curl gets the 302 to the mirror and the file itself.
      # The mirror also aborts long transfers, hence the retries, and the
      # checksum is checked here rather than trusted to the action.
      run: |
        url='https://master.dl.sourceforge.net/project/gnucash/Dependencies/gnucash-5.15-mac-dependencies.tar.xz'
        dest="$GITHUB_WORKSPACE/gnucash-dependencies.tar.xz"
        ok=0
        for attempt in 1 2 3 4 5; do
          if curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
                   --connect-timeout 30 -o "$dest" "$url"; then
            ok=1
            break
          fi
          echo "attempt $attempt failed; retrying in 15s"
          sleep 15
        done
        [ "$ok" = 1 ] || { echo "::error::could not download the dependency tarball"; exit 1; }
        echo "15d14226e93cf18c60eb36d79686171a6b920ed1f72a815b8bad8f8755c76a02  $dest" | shasum -a 256 -c -
    - name: download googletest
      uses: carlosperate/download-file-action@v2

      id: googletest
      with:
        file-url: 'https://github.com/google/googletest/archive/release-1.10.0.tar.gz'
        file-name: googletest.tar.gz
    - name: Extract Dependencies
      run: |
        mkdir -p $HOME/gnucash/inst
        cd $HOME/gnucash/inst
        tar -xf $GITHUB_WORKSPACE/gnucash-dependencies.tar.xz
        mkdir $HOME/gnucash/source
        cd $HOME/gnucash/source
        tar -xf $GITHUB_WORKSPACE/googletest.tar.gz
        mv googletest-* googletest
    - name: Configure GnuCash
      run: |
        mkdir $HOME/gnucash/build
        cd $HOME/gnucash/build
        cmake -GNinja -DPKG_CONFIG_EXECUTABLE=$PREFIX/bin/pkgconf -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX -DWITH_PYTHON=ON -DGTEST_ROOT=$SRCROOT/googletest $GITHUB_WORKSPACE
    - name: Build and Test GnuCash
      run: |
        cd $HOME/gnucash/build
        ninja
        ninja check
      env:
        CTEST_OUTPUT_ON_FAILURE: On
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: TestLog
        path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log
        if-no-files-found: ignore
